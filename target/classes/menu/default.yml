# ==============================================================================
# Seria Ecosystem - Universal Menu Configuration Template (default.yml)
# ==============================================================================
# File ini adalah contoh konfigurasi menu lengkap dengan seluruh fitur modern
# SeriaCore & SeriaJobs (Standard SquidPlugins / PlayerLevel / DeluxeMenus).
#
# Fitur Utama yang Didukung:
# 1. view-requirement (Kondisional kemunculan item berdasarkan Placeholder / Permission)
# 2. priority (Hierarki prioritas item pada slot yang sama)
# 3. open-commands (Registrasi otomatis command pembuka menu ke server)
# 4. placeholders: functions (short-track, progress bar dinamis, transform lore)
# 5. Rumus Matematika $e(...) (misal: $e(%xp% - %req%) atau $e(round(%val%, 0)))
# 6. Pewarnaan Hex Potion & Tipped Arrow (potion: "#518EFF")
# 7. Item Flags, Custom Model Data, Skull Owner, dan Custom Actions
# ==============================================================================

id: "default_menu"
title: "<gradient:#2c3e50:#3498db><bold>Seria Menu</bold> | %player_name%</gradient>"
size: 54
use-player-inventory: true

# Command shortcut untuk membuka menu ini secara langsung
# Didukung oleh DynamicCommandRegistrar SeriaCore
open-commands:
  register:
    - "seriamenu"
    - "smenu"
    - "profil"
    - "profile"

# Pengaturan tata letak dinamis / slot area konten
layout:
  "content":
    slots: [ 20, 21, 22, 23, 24, 29, 30, 31, 32, 33 ]

# ==============================================================================
# FILLERS (Item Pembatas / Dekorasi GUI)
# ==============================================================================
fillers:
  border_glass:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
    slots: [ 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 51, 52, 53 ]
    # Filler juga mendukung view-requirement jika ingin disembunyikan untuk player tertentu
    view-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%floodgate_isbedrock%"
          comparison: "!="
          output: "true"

# ==============================================================================
# ITEMS (Daftar Item Menu)
# ==============================================================================
items:

  # ----------------------------------------------------------------------------
  # 1. Profil Pemain (Menggunakan Skull, Rumus $e, & Progress Bar Function)
  # ----------------------------------------------------------------------------
  player_profile:
    slot: 4
    material: "PLAYER_HEAD"
    skull-owner: "%player_name%"
    name: "<gradient:#f1c40f:#e67e22><bold>%player_name%</bold></gradient> <gray>(Worker Profile)</gray>"
    lore:
      - "<dark_gray>----------------------------------------</dark_gray>"
      - "<gray>Pangkat / Group: <yellow>%seriajobs_luckperms_group%</yellow>"
      - "<gray>Level Pekerjaan: <gold>%seriajobs_level%</gold>"
      - "<gray>Progres XP: <yellow>%seriajobs_xp% / %seriajobs_required_xp%</yellow>"
      - "<gray>Sisa XP Dibutuhkan: <red>$e(%seriajobs_required_xp% - %seriajobs_xp%) XP</red>"
      - ""
      - "<gray>Progress Bar:"
      - " %placeholders_level-xp-progress%"
      - ""
      - "<yellow>▶ Klik untuk menyegarkan tampilan</yellow>"
      - "<dark_gray>----------------------------------------</dark_gray>"
    click-actions:
      - "[refresh delay=0.1]"

  # ----------------------------------------------------------------------------
  # 2. Contoh Slot Bersyarat dengan PRIORITY (Item ON vs Item OFF)
  # Slot 22 akan menampilkan 'vip_feature_unlocked' jika syarat terpenuhi.
  # Jika syarat gagal, sistem otomatis jatuh ke 'vip_feature_locked' (priority 0).
  # ----------------------------------------------------------------------------
  vip_feature_unlocked:
    slot: 22
    priority: 1
    material: "NETHER_STAR"
    name: "<gradient:#a855f7:#ec4899><bold>Fitur Khusus VIP</bold></gradient> <green>[TERBUKA]</green>"
    lore:
      - "<gray>Selamat! Anda memenuhi syarat untuk mengakses fitur ini."
      - "<gray>Status: <green>Aktif</green>"
      - ""
      - "<green>▶ Klik untuk membuka menu khusus</green>"
    # Format Blok Terstruktur (Structured View-Requirement)
    view-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%seriajobs_level%"
          comparison: ">="
          output: "5"
        2:
          type: "has permission"
          permission: "seria.vip"
    left-click-actions:
      - "[player] seriajobs"

  vip_feature_locked:
    slot: 22
    priority: 0
    material: "BARRIER"
    name: "<red><bold>Fitur Khusus VIP</bold> [TERKUNCI]</red>"
    lore:
      - "<gray>Fitur ini terkunci!"
      - "<gray>Syarat: <red>Level Job >= 5</red> dan rank <purple>VIP</purple>."
      - "<gray>Level Anda saat ini: <yellow>%seriajobs_level%</yellow>"
      - ""
      - "<red>✖ Anda belum memenuhi persyaratan</red>"
    click-actions:
      - "[refresh delay=0.25] 22"

  # ----------------------------------------------------------------------------
  # 3. Contoh Inline String View-Requirement & Dynamic Potion Hex Color
  # ----------------------------------------------------------------------------
  alchemy_boost_potion:
    slot: 24
    material: "TIPPED_ARROW"
    potion: "#518EFF"  # Warna Hex RGB khusus ramuan / panah
    name: "<aqua><bold>Ramuan Booster Pekerja</bold></aqua>"
    lore:
      - "<gray>Memberikan efek tambahan kecepatan kerja."
      - ""
      - "%placeholders_tier-status-display%"
      - ""
      - "<yellow>▶ Klik untuk mengklaim</yellow>"
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"
      - "HIDE_ATTRIBUTES"
    # Format String Singkat (Inline View-Requirement)
    view-requirement:
      1: "[placeholder] %seriajobs_level% >= 1"
      2: "[permission] seria.booster.use"
    left-click-actions:
      - "[console] effect give %player% speed 60 1"
      - "[refresh delay=0.25] 24"

  # ----------------------------------------------------------------------------
  # 4. Navigasi Halaman (Previous / Next Page dengan Priority)
  # ----------------------------------------------------------------------------
  previous_page_active:
    slot: 48
    priority: 1
    material: "TIPPED_ARROW"
    potion: "#518EFF"
    name: "<aqua>◀ Halaman Sebelumnya</aqua>"
    view-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%layout_page%"
          comparison: "!="
          output: "1"
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"
    click-actions:
      - "[previous-page] content"
      - "[refresh delay=0.25] 48"
      - "[refresh delay=0.25] 50"

  previous_page_inactive:
    slot: 48
    priority: 0
    material: "TIPPED_ARROW"
    potion: "#C7D2D6"
    name: "<dark_gray>◀ Halaman Sebelumnya (Awal)</dark_gray>"
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"

  next_page_active:
    slot: 50
    priority: 1
    material: "TIPPED_ARROW"
    potion: "#518EFF"
    name: "<aqua>Halaman Berikutnya ▶</aqua>"
    view-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%layout_page%"
          comparison: "!="
          output: "%layout_maxpage%"
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"
    click-actions:
      - "[next-page] content"
      - "[refresh delay=0.25] 48"
      - "[refresh delay=0.25] 50"

  next_page_inactive:
    slot: 50
    priority: 0
    material: "TIPPED_ARROW"
    potion: "#C7D2D6"
    name: "<dark_gray>Halaman Berikutnya (Akhir) ▶</dark_gray>"
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"

  # ----------------------------------------------------------------------------
  # 5. Tombol Tutup Menu
  # ----------------------------------------------------------------------------
  close_button:
    slot: 49
    material: "RED_DYE"
    name: "<red><bold>Tutup Menu</bold></red>"
    lore:
      - "<gray>Klik untuk keluar dari menu."
    click-actions:
      - "[close]"

# ==============================================================================
# PLACEHOLDERS & FUNCTIONS ENGINE
# ==============================================================================
# Bagian ini dievaluasi oleh MenuFunctionEngine SeriaCore:
# 1. "short-track": Memetakan nilai formula ke cabang material / status
# 2. "progress": Membuat progress bar visual dinamis
# 3. "transform: list<component-wrapper>": Menghasilkan baris lore dinamis
# ==============================================================================
placeholders:

  # Menentukan material reward dinamis berdasarkan selisih level pemain
  get-material-for-rewards:
    type: "function"
    function: "short-track"
    input: "$e(%seriajobs_level% - 10)"
    tracks:
      ">=0": "DIAMOND_BLOCK"
      "==-1": "GOLD_BLOCK"
      "<-1": "IRON_BLOCK"

  # Transform lore multi-baris dinamis berdasarkan status pemain
  tier-status-display:
    type: "transform"
    transform: "list<component-wrapper>"
    value:
      type: "function"
      function: "short-track"
      input: "$e(%seriajobs_level% - 5)"
      tracks:
        ">=0":
          - " <gray>▪ Status Tingkat: <green>Tingkat Tinggi (Master)</green>"
          - " <gray>▪ Bonus Hasil: <gold>+50% Drop</gold>"
        "<0":
          - " <gray>▪ Status Tingkat: <yellow>Tingkat Pemula</yellow>"
          - " <gray>▪ Target Berikutnya: <white>Capai Level 5</white>"

  # Progress bar dinamis (XP Progres Pekerjaan)
  level-xp-progress:
    type: "function"
    function: "progress"
    first-remaining: "<dark_gray>|"
    first-completing: "<green>|"
    remaining: "<dark_gray>|"
    completing: "<green>|"
    last-remaining: "<dark_gray>|"
    last-completing: "<green>|"
    value: "%seriajobs_xp%"
    max: "%seriajobs_required_xp%"
    length: 30
