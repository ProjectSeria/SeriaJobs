name: SeriaArmorSet
version: '${project.version}'
main: id.seria.armorset.SeriaArmorSetPlugin
api-version: '1.20'
author: Seria Team
description: Custom MMOItems Armor Set Skills & Bonus Engine for Project Seria.
depend:
  - MMOItems
  - MythicLib
softdepend:
  - SeriaCore
  - MythicMobs
  - PlaceholderAPI

commands:
  armorset:
    description: Primary SeriaArmorSet admin command
    permission: seriaarmorset.reload
    aliases:
      - seriaarmorset
  settelepathy:
    description: Legacy alias for telepathy drop collector
    permission: settelepathy.reload
    aliases:
      - telepathy

permissions:
  seriaarmorset.admin:
    description: Full access to SeriaArmorSet administrative commands
    default: op
  seriaarmorset.reload:
    description: Allows reloading the SeriaArmorSet configuration
    default: op
  seriaarmorset.status:
    description: Allows inspecting player armor set status and active skills
    default: op
  settelepathy.reload:
    description: Compatibility permission for reloading
    default: op