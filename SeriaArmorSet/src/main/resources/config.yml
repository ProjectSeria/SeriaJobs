# ==============================================================================
#                      SeriaArmorSet Configuration
#        Armor Set Bonus Plugin: Telepathy Drop Handling for Project Seria
# ==============================================================================

# Aktifkan mode debug untuk melihat log detail di console server
debug: false

# Daftar armor set MMOItems yang mengaktifkan efek Telepathy (drop langsung masuk inventory).
# Key = MMOItems item-set ID (case-insensitive, sesuai konfigurasi item-sets.yml).
# pieces-required = jumlah item armor dari set ini yang wajib dikenakan oleh pemain.
sets:
  HALLOWEEN2026_FREE:
    pieces-required: 4
  HALLOWEEN2026_PREMIUM:
    pieces-required: 4

# Pengaturan opsi fungsionalitas telepathy
options:
  # Drop dari blok yang dihancurkan langsung masuk ke inventory pemain
  blocks: true

  # Drop dari monster / mob (termasuk MythicMobs) langsung masuk ke inventory killer
  mobs: true

  # EXP dari mob yang dibunuh langsung diberikan ke killer
  xp: true

  # Mainkan efek suara saat item berhasil masuk ke inventory
  play-sound: true
  sound-name: "ENTITY_ITEM_PICKUP"
  sound-volume: 0.5
  sound-pitch: 1.2

  # Hanya periksa slot armor (HELMET, CHESTPLATE, LEGGINGS, BOOTS).
  # Jika false, slot accessory MMOItems juga dapat dihitung jika memiliki set tag.
  armor-slots-only: true

# Integrasi & Hook plugin eksternal
hooks:
  seriacore: true
  mmoitems: true
  mythiclib: true
  mythicmobs: true
  placeholderapi: true

# Pesan sistem (Mendukung Adventure MiniMessage, SeriaCore semantic tags, & legacy color codes)
messages:
  prefix: "<gradient:#FF8A00:#E52E71><bold>SeriaSet</bold></gradient> <dark_gray>»</dark_gray> "
  reload: "<green>Konfigurasi SeriaArmorSet berhasil dimuat ulang!</green>"
  no-permission: "<red>Kamu tidak memiliki izin untuk menggunakan perintah ini.</red>"
  player-not-found: "<red>Pemain <yellow>{player}</yellow> tidak ditemukan atau sedang offline.</red>"
  status-wearing: "<gray>Pemain <white>{player}</white> sedang mengenakan set <gold><bold>{set}</bold></gold> (<green>{pieces}/{required}</green> bagian). Efek Telepathy: <green><bold>AKTIF</bold></green>.</gray>"
  status-not-wearing: "<gray>Pemain <white>{player}</white> <red>tidak mengenakan</red> set armor telepathy yang aktif.</gray>"
  help:
    - "<gradient:#FF8A00:#E52E71><bold>SeriaArmorSet (SetTelepathy)</bold></gradient> <gray>v{version}</gray>"
    - "<gray>/settelepathy reload <dark_gray>-</dark_gray> <white>Muat ulang konfigurasi plugin</white></gray>"
    - "<gray>/settelepathy status [player] <dark_gray>-</dark_gray> <white>Periksa status armor set pemain</white></gray>"
