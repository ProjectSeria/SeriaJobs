# ==============================================================================
#                      SeriaArmorSet Configuration
#        Custom MMOItems Armor Set Skills Engine for Project Seria
# ==============================================================================

# Aktifkan mode debug untuk melihat log detail di console server
debug: false

# Integrasi & Hook plugin eksternal
hooks:
  seriacore: true
  mmoitems: true
  mythiclib: true
  mythicmobs: true
  placeholderapi: true

# Pengaturan umum pemeriksaan armor
settings:
  # Hanya periksa slot armor utama (HELMET, CHESTPLATE, LEGGINGS, BOOTS).
  # Jika false, slot accessory MMOItems juga akan ikut dihitung jika memiliki tag set.
  armor-slots-only: true

# Opsi default untuk skill Telepathy bawaan
options:
  blocks: true         # Block drop -> inventory
  mobs: true           # Mob drop -> killer inventory
  xp: true             # Mob XP -> killer
  play-sound: true     # Mainkan efek suara saat item masuk ke inventory
  sound-name: "ENTITY_ITEM_PICKUP"
  sound-volume: 0.5
  sound-pitch: 1.2

# Pesan sistem (Mendukung Adventure MiniMessage, SeriaCore semantic tags, & legacy color codes)
messages:
  prefix: "<gradient:#FF8A00:#E52E71><bold>SeriaArmorSet</bold></gradient> <dark_gray>»</dark_gray> "
  reload: "<green>Konfigurasi SeriaArmorSet berhasil dimuat ulang!</green>"
  no-permission: "<red>Kamu tidak memiliki izin untuk menggunakan perintah ini.</red>"
  player-not-found: "<red>Pemain <yellow>{player}</yellow> tidak ditemukan atau sedang offline.</red>"
  status-wearing: "<gray>Pemain <white>{player}</white> mengenakan set <gold><bold>{set}</bold></gold> (<green>{pieces}/{required}</green> bagian). Skills aktif: <green>{skills}</green>.</gray>"
  status-not-wearing: "<gray>Pemain <white>{player}</white> <red>tidak mengenakan</red> armor set kustom yang aktif.</gray>"
  help:
    - "<gradient:#FF8A00:#E52E71><bold>SeriaArmorSet Engine</bold></gradient> <gray>v{version}</gray>"
    - "<gray>/armorset reload <dark_gray>-</dark_gray> <white>Muat ulang konfigurasi plugin</white></gray>"
    - "<gray>/armorset status [player] <dark_gray>-</dark_gray> <white>Periksa status armor set pemain</white></gray>"
    - "<gray>/armorset list <dark_gray>-</dark_gray> <white>Daftar seluruh armor set dan skill terdaftar</white></gray>"

# ==============================================================================
#                      Armor Sets & Skill Modules
# ==============================================================================
# Anda dapat mendaftarkan set langsung di sini ATAU membuat file terpisah
# di dalam folder 'sets/*.yml' (misalnya: sets/halloween_2026.yml).
sets:
  HALLOWEEN2026_FREE:
    pieces-required: 4
    skills:
      telepathy:
        enabled: true
        blocks: true
        mobs: true
        xp: true

  HALLOWEEN2026_PREMIUM:
    pieces-required: 4
    skills:
      telepathy:
        enabled: true
        blocks: true
        mobs: true
        xp: true
      # Di sini nantinya dapat ditambahkan custom skill baru yang tidak bisa
      # ditangani oleh MythicLib/MMOItems bawaan:
      # eclipse_vacuum:
      #   radius: 6.0