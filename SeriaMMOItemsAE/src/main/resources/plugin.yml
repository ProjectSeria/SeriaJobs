name: SeriaMMOItemsAE
version: '${project.version}'
main: id.seria.mmoae.SeriaMMOItemsAEPlugin
api-version: '1.20'
author: Seria Team
description: Bridge plugin connecting MMOItems YAML templates with AdvancedEnchantments (AE).
depend:
  - MMOItems
  - MythicLib
softdepend:
  - AdvancedEnchantments

commands:
  mmoae:
    description: MMOItems and AdvancedEnchantments bridge commands
    permission: seriammoae.admin
    aliases:
      - aebridge
      - mmoitems-ae

permissions:
  seriammoae.admin:
    description: Allows administrative access to MMOItems-AE bridge commands
    default: op
