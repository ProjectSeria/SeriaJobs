# ==============================================================
# SeriaJobs - English Localization (MiniMessage)
# ==============================================================
prefix: "<gradient:#38bdf8:#818cf8><bold>SeriaJobs</bold></gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "<red>You do not have permission to execute this command!</red>"
  player-only: "<red>This command can only be executed by in-game players!</red>"
  job-not-found: "<red>Job <yellow>{job}</yellow> was not found in the system!</red>"
  reload-success: "<green>All configurations, menus, and job files were reloaded in <yellow>{ms}ms</yellow>!</green>"
  unknown-subcommand: "<red>Unknown sub-command. Type <yellow>/jobs help</yellow> for assistance.</red>"

jobs:
  join-success: "<green>Congratulations! You have joined the <white>{job}</white> job!</green>"
  already-joined: "<yellow>You have already joined the <white>{job}</white> job!</yellow>"
  slot-full: "<red>Your job slots are full (<yellow>{active}/{max}</yellow>)! Upgrade your rank or resign from another job first.</red>"
  leave-success: "<gray>You have resigned from <white>{job}</white>. Your job slot is now freed.</gray>"
  leave-cooldown: "<red>You are currently on resignation cooldown! Please wait <yellow>{time}</yellow> before changing jobs.</red>"
  not-joined: "<red>You have not joined this job yet!</red>"
  level-up: "<gradient:#f59e0b:#fbbf24><bold>JOB LEVEL UP!</bold></gradient> <gray>Your <green>{job}</green> job has advanced to Level <gold><bold>{level}</bold></gold>!</gray>"

orders:
  deposit-success: "<green>Successfully deposited <yellow>{amount}x</yellow> {item} for work order <white>{order}</white>!</green>"
  deposit-none: "<red>You do not have any matching items in your inventory to deposit!</red>"
  deposit-all-success: "<green>Successfully scanned and deposited all active contract items from your inventory!</green>"
  order-completed: "<gradient:#10b981:#34d399><bold>CONTRACT FULFILLED!</bold></gradient> <gray>Contract <gold>{order}</gold> completed! Rewards have been added to your account.</gray>"
  stash-delivered: "<aqua>[Stash]</aqua> <yellow>Your inventory is full! Reward items were delivered to your SeriaCore /stash mailbox.</yellow>"
  already-completed: "<yellow>This work order has already been completed during the current shift!</yellow>"

admin:
  forceroll-all: "<green>Successfully forced a new market contract shift for all jobs!</green>"
  forceroll-job: "<green>Successfully forced a new market contract shift for <yellow>{job}</yellow>!</green>"
  setlevel-success: "<green>Job level for <yellow>{job}</yellow> on player <white>{player}</white> successfully set to <gold>{level}</gold>!</green>"
