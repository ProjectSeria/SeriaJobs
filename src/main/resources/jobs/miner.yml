# ==============================================================================
# WORK ORDERS (dibaca plugin)
# Digenerate dari data `actions:` di bawah (skema Jobs Reborn, tidak dibaca plugin).
# - Nilai relatif antar item  = experience per unit di actions (range 0-200)
# - Skala reward             = dikalibrasi ke alchemist.yml (order median ~1000 uang / 150 XP)
# - Jumlah (amount)          = makin langka item, makin sedikit yang diminta
# Angka di sini adalah DRAFT balancing: silakan disesuaikan.
# ==============================================================================
orders-pool:
  halloween_blackstone_excavation:
    display-name: "<gold>🎃 Tambang Blackstone Misterius</gold>"
    event: "halloween"
    rerollable: false
    lore:
      - "<lore-color>Status: <accentuation-color>{progress}/{required} Blackstone</accentuation-color>"
      - "<lore-color>Gali batu hitam purba untuk ritual malam Halloween."
    min-reputation: 5
    max-reputation: 15
    required-item:
      source: "VANILLA"
      material: "BLACKSTONE"
      amount: 128
      strict-nbt: false
    rewards:
      - type: "VAULT"
        amount: 45000.0
        display: "  <lore-color>▪ <money-color>45.000 $"
      - type: "JOB_XP"
        amount: 320
        display: "  <lore-color>▪ <yellow>320 Job XP"
