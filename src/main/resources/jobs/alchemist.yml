id: "alchemist"
display-name: "<gradient:#9b59b6:#8e44ad><bold>Royal Alchemist</bold></gradient>"
icon: "BREWING_STAND"
description:
  - "<gray>Supplies potions, chemical reagents, and arcane"
  - "<gray>extracts to fulfill laboratory research requests."
  - ""
  - "<yellow>Click to view open work orders!</yellow>"

leveling:
  max-level: 50
  base-xp: 150
  multiplier: 1.30

active-orders-count: 2

# Milestone rewards unlocked at specific level tiers
level-rewards:
  5:
    rewards:
      - type: "VAULT"
        amount: 2000.0
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 1000
  10:
    rewards:
      - type: "VAULT"
        amount: 5000.0
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 3000
      - type: "COMMAND"
        executor: "CONSOLE"
        command: "give %player% blaze_rod 16"
  25:
    rewards:
      - type: "VAULT"
        amount: 15000.0
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 8000
  50:
    rewards:
      - type: "VAULT"
        amount: 75000.0
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 35000

orders-pool:
  potion_supply:
    display-name: "<light_purple>Crystal Glass Bottles</light_purple>"
    lore:
      - "<gray>Status: <yellow>{progress}/{required} Bottles</yellow>"
      - "<gray>Deliver pristine glass phials for apothecary brewing."
    required-item:
      source: "VANILLA"
      material: "GLASS_BOTTLE"
      amount: 64
      strict-nbt: false
    rewards:
      - type: "VAULT"
        amount: 800.0
      - type: "JOB_XP"
        amount: 120
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 300

  nether_wart_supply:
    display-name: "<red>Nether Wart Extract</red>"
    lore:
      - "<gray>Status: <yellow>{progress}/{required} Nether Wart</yellow>"
      - "<gray>Essential brewing reagent for potent arcane draughts."
    required-item:
      source: "VANILLA"
      material: "NETHER_WART"
      amount: 128
      strict-nbt: false
    rewards:
      - type: "VAULT"
        amount: 1500.0
      - type: "JOB_XP"
        amount: 250
      - type: "AURASKILLS_XP"
        skill: "alchemy"
        amount: 600
