name: SeriaJobs
version: '${project.version}'
main: id.seria.jobs.SeriaJobs
api-version: '1.21'
author: Seria Network
description: Supply-Chain Fulfillment and Market Work Order plugin for Seria Network

depend: [SeriaCore]

softdepend:
  - Vault
  - ExcellentEconomy
  - PlaceholderAPI
  - LuckPerms
  - AuraSkills
  - MMOItems
  - MythicLib
  - MythicMobs
  - SeriaTranslator
  - SeriaMagicBundle
  - MagicBundle

commands:
  seriajobs:
    description: Perintah utama sistem pekerjaan SeriaJobs
    aliases: [jobs, job]
    permission: seriajobs.use
    usage: /<command> [join|leave|admin]

permissions:
  seriajobs.use:
    description: Memberikan izin membuka menu bursa kerja dan menyetor pesanan
    default: true
  seriajobs.admin:
    description: Memberikan akses ke perintah administratif SeriaJobs
    default: op
  seriajobs.slots.*:
    description: Memperbolehkan pemain mengambil seluruh pekerjaan tanpa batasan kuota
    default: false
