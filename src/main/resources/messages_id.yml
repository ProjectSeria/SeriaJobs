# ==============================================================
# SeriaJobs - Indonesian Localization (MiniMessage)
# ==============================================================
prefix: "<gradient:#38bdf8:#818cf8><bold>SeriaJobs</bold></gradient> <dark_gray>»</dark_gray> "

general:
  no-permission: "<red>Anda tidak memiliki izin untuk menggunakan perintah ini!</red>"
  player-only: "<red>Perintah ini hanya dapat dijalankan oleh pemain dalam game!</red>"
  job-not-found: "<red>Pekerjaan <yellow>{job}</yellow> tidak ditemukan dalam sistem!</red>"
  reload-success: "<green>Seluruh konfigurasi, menu, dan berkas pekerjaan berhasil dimuat ulang dalam <yellow>{ms}ms</yellow>!</green>"
  unknown-subcommand: "<red>Sub-perintah tidak dikenali. Ketik <yellow>/jobs help</yellow> untuk bantuan.</red>"

jobs:
  join-success: "<green>Selamat! Anda telah bergabung ke dalam pekerjaan <white>{job}</white>!</green>"
  already-joined: "<yellow>Anda sudah bergabung dengan pekerjaan <white>{job}</white>!</yellow>"
  slot-full: "<red>Slot pekerjaan Anda penuh (<yellow>{active}/{max}</yellow>)! Tingkatkan rank atau tinggalkan pekerjaan lain terlebih dahulu.</red>"
  leave-success: "<gray>Anda telah mengundurkan diri dari pekerjaan <white>{job}</white>. Slot kini tersedia kembali.</gray>"
  leave-cooldown: "<red>Anda masih dalam masa jeda pengunduran diri! Tunggu <yellow>{time}</yellow> sebelum dapat berganti pekerjaan.</red>"
  not-joined: "<red>Anda belum bergabung dengan pekerjaan ini!</red>"
  level-up: "<gradient:#f59e0b:#fbbf24><bold>JOB LEVEL UP!</bold></gradient> <gray>Pekerjaan <green>{job}</green> Anda naik ke Level <gold><bold>{level}</bold></gold>!</gray>"

orders:
  deposit-success: "<green>Berhasil menyetor <yellow>{amount}x</yellow> {item} untuk pesanan <white>{order}</white>!</green>"
  deposit-none: "<red>Anda tidak memiliki item yang sesuai di inventaris untuk disetorkan!</red>"
  deposit-all-success: "<green>Berhasil memindai dan menyetorkan seluruh komoditas kontrak aktif dari inventaris Anda!</green>"
  order-completed: "<gradient:#10b981:#34d399><bold>KONTRAK TERPENUHI!</bold></gradient> <gray>Kontrak <gold>{order}</gold> selesai! Reward telah diberikan ke akun Anda.</gray>"
  stash-delivered: "<aqua>[Stash]</aqua> <yellow>Inventaris Anda penuh! Hadiah item dikirimkan ke kotak pos /stash SeriaCore.</yellow>"
  already-completed: "<yellow>Pesanan ini sudah selesai pada rotasi saat ini!</yellow>"
  reroll-max-reached: "<red>Batas maksimal reroll (10x) periode ini sudah habis!</red>"
  reroll-insufficient-gins: "<red>Saldo Gins tidak mencukupi untuk reroll! Dibutuhkan: <gold>{cost} Gins</gold>.</red>"
  reroll-insufficient-serium: "<red>Saldo Serium tidak mencukupi untuk reroll! Dibutuhkan: <aqua>{cost} Serium</aqua>.</red>"
  reroll-success-gins: "<green>Berhasil meroll pesanan slot #{slot}! Biaya: <gold>{cost} Gins</gold>. Sisa kuota: <yellow>{remaining}/10</yellow>.</green>"
  reroll-success-serium: "<green>Berhasil meroll pesanan slot #{slot}! Biaya: <aqua>{cost} Serium</aqua>. Sisa kuota: <yellow>{remaining}/10</yellow>.</green>"

admin:
  forceroll-all: "<green>Berhasil memaksa rotasi bursa kontrak baru untuk seluruh pekerjaan!</green>"
  forceroll-job: "<green>Berhasil memaksa rotasi bursa kontrak baru untuk pekerjaan <yellow>{job}</yellow>!</green>"
  setlevel-success: "<green>Level pekerjaan <yellow>{job}</yellow> untuk pemain <white>{player}</white> berhasil diubah menjadi <gold>{level}</gold>!</green>"
