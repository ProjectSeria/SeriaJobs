# ==============================================================
# SeriaJobs - Custom Reroll Placeholders Engine (SeriaCore Nested Architecture)
# File: placeholder/reroll.yml
# Usage:
#   %custom_reroll_status%                -> Tampilan status / instruksi reroll dinamis
#   %custom_reroll_choice%                -> 'free', 'gins', 'serium', atau 'none'
#   %custom_reroll_command%               -> Command dinamis: 'eco take ...', 'serium take ...', atau kosong
#   %custom_reroll_deduct-command%        -> Alias command dinamis
#   %custom_reroll_deduct-action%         -> Action lengkap: '[console] eco take ...' dsb.
#   %custom_reroll_deny-message%          -> Pesan deny dinamis sesuai alasan gagal (Gins / Serium)
# ==============================================================

# 1. Evaluasi Status Lore Berdasarkan Fase Reroll
# - Fase 0 (Roll pertama): Gratis
# - Fase 1 s/d 10 (10x Reroll Gins): Menggunakan Gins
# - Fase > 10 (Ekstra): Menggunakan Serium (1 Serium per roll)
status:
  type: "function"
  function: "short-track"
  input: "%jobsorder_reroll_current%"
  tracks:
    "<=0": "%sc_action-icon% %sc_action-color%Klik Kanan: Reroll Order %sc_success-color%Gratis <dark_gray>(%jobsorder_reroll_ratio%)"
    "<=9": "%custom_reroll_status-gins%"
    default: "%custom_reroll_status-serium%"

status-gins:
  type: "function"
  function: "short-track"
  input: "%custom_reroll_math-gins-difference%"
  tracks:
    ">=0": "%sc_action-icon% %sc_action-color%Klik Kanan: Reroll Order %sc_gins-color%%jobsorder_reroll_cost_gins% Gins <dark_gray>(%jobsorder_reroll_ratio%)"
    default: "%sc_error-message%Tidak cukup Gins untuk reroll! <dark_gray>(%jobsorder_reroll_ratio%)"

status-serium:
  type: "function"
  function: "short-track"
  input: "%jobsorder_serium_balance%"
  tracks:
    ">=1": "%sc_action-icon% %sc_action-color%Klik Kanan: Reroll Order %sc_serium-color%%jobsorder_reroll_cost_serium% Serium <dark_gray>(%jobsorder_reroll_ratio%)"
    default: "%sc_error-message%Tidak cukup Serium untuk reroll! <dark_gray>(%jobsorder_reroll_ratio%)"

# 2. Perhitungan Selisih Saldo Gins terhadap Biaya Reroll
# Formula: Saldo Gins Pemain - Biaya Reroll Berikutnya
# Gunakan %jobsorder_gins_balance% (angka murni dari Vault API) dan ekspresi $e(...)
math-gins-difference:
  type: "math"
  input: "$e(%jobsorder_gins_balance% - %jobsorder_reroll_cost_gins%)"

# 3. Identifier Pilihan Ringkas ('free', 'gins', 'serium', atau 'none')
# Digunakan oleh GUI requirement (has_currency: %custom_reroll_choice% != none)
choice:
  type: "function"
  function: "short-track"
  input: "%jobsorder_reroll_current%"
  tracks:
    "<=0": "free"
    "<=9": "%custom_reroll_choice-gins%"
    default: "%custom_reroll_choice-serium%"

choice-gins:
  type: "function"
  function: "short-track"
  input: "%custom_reroll_math-gins-difference%"
  tracks:
    ">=0": "gins"
    default: "none"

choice-serium:
  type: "function"
  function: "short-track"
  input: "%jobsorder_serium_balance%"
  tracks:
    ">=1": "serium"
    default: "none"

# 4. Dynamic Console Command untuk Pemotongan Biaya Reroll
# - 'free'   -> "" (Gratis, tidak memotong saldo)
# - 'gins'   -> eco take %player_name% %jobsorder_reroll_cost_gins%
# - 'serium' -> serium take %player_name% %jobsorder_reroll_cost_serium%
# - 'none'   -> ""
command:
  type: "function"
  function: "short-track"
  input: "%custom_reroll_choice%"
  tracks:
    "==free": ""
    "==gins": "eco take %player% %jobsorder_reroll_cost_gins%"
    "==serium": "serium take %player% %jobsorder_reroll_cost_serium%"
    default: ""

# Alias alternatif untuk %custom_reroll_command%
deduct-command:
  type: "function"
  function: "short-track"
  input: "%custom_reroll_choice%"
  tracks:
    "==free": ""
    "==gins": "eco take %player% %jobsorder_reroll_cost_gins%"
    "==serium": "serium take %player% %jobsorder_reroll_cost_serium%"
    default: ""

# Format Action Lengkap dengan prefix [console]
deduct-action:
  type: "function"
  function: "short-track"
  input: "%custom_reroll_choice%"
  tracks:
    "==free": ""
    "==gins": "[console] eco take %player% %jobsorder_reroll_cost_gins%"
    "==serium": "[console] serium take %player% %jobsorder_reroll_cost_serium%"
    default: ""

# 5. Pesan Deny Dinamis untuk GUI Requirement
deny-message:
  type: "function"
  function: "short-track"
  input: "%jobsorder_reroll_current%"
  tracks:
    "<=9": "%sc_error-message% Tidak cukup Gins untuk reroll!"
    default: "%sc_error-message% Tidak cukup Serium untuk reroll!"
