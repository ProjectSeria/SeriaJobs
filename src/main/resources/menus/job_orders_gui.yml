title: "<sc:menu-prefix>Jobs ⏵ {job_name} (Lv. {job_level})"
size: 54

fillers:
  glass:
    material: "YELLOW_STAINED_GLASS_PANE"
    name: " "
    slots: [0, 1, 7, 8, 9, 36, 44, 45, 46, 52, 53]
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"

# Slot penempatan dinamis kartu order aktif
layout:
  order-slots:
    slots: [20, 22, 24, 30, 32]
    item-provider: "%parameters_job_orders%"
    selector:
      requirements:
        1:
          taint: "orders-item"
          comparison: "=="
          value: true  
items:
  incomplete:
    name: "<sc:error-color>{order_display_name}"
    taints:
      orders-item: true
    lore:
#      - "{order_lore}"
      - ""
#      - "<sc:lore-color>Kebutuhan: <sc:highlight-color>{item_name} <gray>(x{required_amount})"
      - "<sc:sub-title-color>Progres"
      - "       <sc:lore-color>Item: <sc:highlight-color>{progress}<sc:lore-color>/<sc:highlight-color>{required_amount} <dark_gray>({percentage}%)"
      - "{progress_bar}"
      - ""
      - "<sc:sub-title-color>Hadiah"
      - "{rewards_list}"
      - ""
      - "<sc:action-icon> <sc:action-color>Setor"
      - "%custom_reroll_status%"
    left-click-action:
      - "[DEPOSIT]"
    # Requirement Klik Kanan:
    # Mengecek apakah kuota reroll masih ada DAN apakah saldo Gins atau Serium mencukupi
    right-click-requirement:
      requirements:
        has_currency:
          type: "placeholder"
          input: "%custom_reroll_choice%"
          comparison: "!="
          output: "none"
      deny-message: "%custom_reroll_deny-message%"
      deny-actions:
         - "[sound] entity.villager.no 1 1" 
    right-click-action:
      - "[console] %custom_reroll_command%"
      - "[jobs_reroll]"
      - "[refresh] order-card"
      - "[refresh] 4"

  completed:
    name: "<sc:success-color>{order_display_name}"
    taints:
      orders-item: true
    lore:
#      - "{order_lore}"
      - ""
      - "<sc:success-icon> Kontrak selesai!"
      - ""
      - "<sc:info-icon> Tunggu order berikutnya."


  player_status:
    slot: 4
    material: "BOOK" # PLAYER_HEAD
#    skull-owner: "%player_name%"
    name: "<sc:title-color>Informasi"
    lore:
      - ""
      - "<sc:lore-color>Selesaikan semua order"
      - "<sc:lore-color>untuk mendapatkan hadiah."
      - ""
      - "<sc:sub-title-color>Status"
      - " <sc:sub-title-color><sc:tab-prefix> <sc:lore-color>Job: <sc:success-color>%seriajobs_active_jobs% <sc:lore-color>(<sc:highlight-color>Lv.%seriajobs_level%<sc:lore-color>)"
      - " <sc:sub-title-color><sc:tab-prefix> <sc:lore-color>Total EXP: <sc:success-color>{xp}<sc:lore-color>/{required_xp}"
      - " <sc:sub-title-color><sc:tab-prefix> <sc:lore-color>Order Selesai: <sc:success-color>%seriajobs_order_completed%"
      - " <sc:sub-title-color><sc:tab-prefix> <sc:lore-color>Reputasi: <sc:success-color>%excellenteconomy_balance_raw_reputasi%"
      - ""
      - "<sc:sub-title-color>Rotasi Order"
      - "<sc:highlight-color>%seriajobs_rotation_countdown%"
      - ""
      - "<sc:action-icon> <sc:action-color>Refresh"
    actions:
      - "[REFRESH]"

  rewards_roadmap_button:
    slot: 3
    material: "CHEST"
    name: "<sc:title-color>Hadiah"
    lore:
      - ""
      - "<sc:lore-color>Milestone dan hadiah"
      - "<sc:lore-color>pada setiap level."
      - ""
      - "<sc:action-icon> <sc:action-color>Akses"
    actions:
      - "[open] job_progression_gui"

  quick_deposit_all:
    slot: 5
    material: "HOPPER"
    name: "<sc:title-color>Setor Semua"
    lore:
      - ""
      - "<sc:lore-color>Otomatis menyetor semua item"
      - "<sc:lore-color>kontrak aktif dari <sc:highlight-color>Inventory"
      - ""
      - "<sc:action-icon> <sc:action-color>Akses"
    actions:
      - "[DEPOSIT_ALL]"
      - "[REFRESH]"

  back_button:
    slot: 49
    material: "RED_DYE"
    name: "<sc:error-color>Tutup"
    actions:
      - "[open] main_job_menu"

  resign_button:
    name: "<sc:error-color>Resign"
    material: "IRON_DOOR"
    slot: 53 # Slot 54 (0-indexed position 53)
    lore:
      - ""
      - "<sc:lore-color>Profession: <sc:highlight-color>{job_name}"
      - ""
      - "<sc:sub-title-color>Informasi"
      - "<sc:lore-color>Kontrak kerja aktif akan hilang," 
      - "<sc:lore-color>dan cooldown 24jam akan diterapkan"
      - "<sc:lore-color>untuk membuat kontrak kerja baru" 
      - ""
      - "<sc:action-icon> <sc:action-color>Resign"
    actions:
      - "[RESIGN]"


