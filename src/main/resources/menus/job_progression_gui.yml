title: "<gradient:#f59e0b:#d97706>Rewards Roadmap: {job_name}</gradient>"
size: 54

fillers:
  glass:
    material: "YELLOW_STAINED_GLASS_PANE"
    name: " "
    slots: [0, 1, 7, 8, 9, 36, 44, 45, 46, 52, 53]
    item-flags:
      - "HIDE_ADDITIONAL_TOOLTIP"

# Penempatan dinamis slot kartu level progression (21 slot per halaman)
layout:
  level-slots:
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
    item-provider: "%parameters_job_levels%"
    selector:
      requirements:
        1:
          taint: "levels-item"
          comparison: "=="
          value: true

items:
  reached-milestone:
    name: "<green><bold>Level {level}</bold></green> <dark_gray>[TERCAPAI - MILESTONE]</dark_gray>"
    material: "EMERALD"
    taints:
      levels-item: true
    priority: 6
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - ""
      - "<gold><bold>Hadiah Milestone Khusus:</bold></gold>"
      - "{rewards_list}"
      - ""
      - "<green>✔ Anda sudah mencapai level ini!</green>"
    view-requirement:
      requirements:
        is_reached:
          type: "placeholder"
          input: "{is_reached}"
          comparison: "=="
          output: "true"
        has_milestone:
          type: "placeholder"
          input: "{has_milestone}"
          comparison: "=="
          output: "true"

  reached:
    name: "<green><bold>Level {level}</bold></green> <dark_gray>[TERCAPAI]</dark_gray>"
    material: "LIME_STAINED_GLASS_PANE"
    taints:
      levels-item: true
    priority: 5
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - ""
      - "{milestone_info}"
      - ""
      - "<green>✔ Anda sudah mencapai level ini!</green>"
    view-requirement:
      requirements:
        is_reached:
          type: "placeholder"
          input: "{is_reached}"
          comparison: "=="
          output: "true"

  next-milestone:
    name: "<yellow><bold>Level {level}</bold></yellow> <gold>[LEVEL BERIKUTNYA - MILESTONE]</gold>"
    material: "GOLD_BLOCK"
    taints:
      levels-item: true
    priority: 4
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - "<gray>Progres Anda: <yellow>{current_xp} / {required_xp} XP</yellow> <dark_gray>(Sisa: {needed_xp} XP)</dark_gray>"
      - ""
      - "<gold><bold>Hadiah Milestone Khusus:</bold></gold>"
      - "{rewards_list}"
      - ""
      - "<yellow>▶ Selesaikan kontrak kerja untuk naik ke level ini!</yellow>"
    view-requirement:
      requirements:
        is_next:
          type: "placeholder"
          input: "{is_next}"
          comparison: "=="
          output: "true"
        has_milestone:
          type: "placeholder"
          input: "{has_milestone}"
          comparison: "=="
          output: "true"

  next:
    name: "<yellow><bold>Level {level}</bold></yellow> <gold>[LEVEL BERIKUTNYA]</gold>"
    material: "YELLOW_STAINED_GLASS_PANE"
    taints:
      levels-item: true
    priority: 3
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - "<gray>Progres Anda: <yellow>{current_xp} / {required_xp} XP</yellow> <dark_gray>(Sisa: {needed_xp} XP)</dark_gray>"
      - ""
      - "{milestone_info}"
      - ""
      - "<yellow>▶ Selesaikan kontrak kerja untuk naik ke level ini!</yellow>"
    view-requirement:
      requirements:
        is_next:
          type: "placeholder"
          input: "{is_next}"
          comparison: "=="
          output: "true"

  locked-milestone:
    name: "<gray>Level {level}</gray> <dark_gray>[TERKUNCI - MILESTONE]</dark_gray>"
    material: "CHEST"
    taints:
      levels-item: true
    priority: 2
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - ""
      - "<gold><bold>Hadiah Milestone Khusus:</bold></gold>"
      - "{rewards_list}"
      - ""
      - "<red>✖ Capai level sebelumnya terlebih dahulu.</red>"
    view-requirement:
      requirements:
        has_milestone:
          type: "placeholder"
          input: "{has_milestone}"
          comparison: "=="
          output: "true"

  locked:
    name: "<gray>Level {level}</gray> <dark_gray>[TERKUNCI]</dark_gray>"
    material: "GRAY_STAINED_GLASS_PANE"
    taints:
      levels-item: true
    priority: 1
    lore:
      - "<gray>Kebutuhan XP: <white>{required_xp} XP</white></gray>"
      - ""
      - "{milestone_info}"
      - ""
      - "<red>✖ Capai level sebelumnya terlebih dahulu.</red>"

  player_status:
    name: "<green>%player_name% - Progression Roadmap</green>"
    material: "PLAYER_HEAD"
    skull-owner: "%player_name%"
    slot: 4
    lore:
      - "<gray>Profession: <white>{job_name}</white>"
      - "<gray>Current Level: <gold>{level}</gold>"
      - "<gray>XP: <yellow>{xp} / {required_xp}</yellow>"
      - ""
      - "<yellow>▶ Click to refresh status</yellow>"
    actions:
      - "[REFRESH]"

  previous_page:
    name: "<yellow>◀ Previous Page</yellow>"
    material: "ARROW"
    slot: 48
    lore:
      - "<gray>Click to return to the previous page.</gray>"
    actions:
      - "[PREV_PAGE]"

  back_button:
    name: "<red>Back to Orders Board</red>"
    material: "BARRIER"
    slot: 49
    actions:
      - "[BACK]"

  next_page:
    name: "<yellow>Next Page ▶</yellow>"
    material: "ARROW"
    slot: 50
    lore:
      - "<gray>Click to view higher level progression tiers.</gray>"
    actions:
      - "[NEXT_PAGE]"