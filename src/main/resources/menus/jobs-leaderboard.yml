id: "jobs-leaderboard"
title: 'Jobs ▸ %placeholders_get-job-name%'
size: 54

menu-parameter:
  parameters:
    job: "Job"
    jobs-name:
      type: string
      default: farmer
    jobs-button:
      type: string
      default: leaderboard
  player-usable: false

variables:
  action:
    type: "string"
    default: "first"

items:

  items:

  ##############################
  #           NAVBAR           #
  ##############################

  filler-navbar:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: [10, 11, 12, 13, 14, 15, 16, 17, 1, 10, 19, 28, 37, 46]
    hide-tooltip: true
    priority: 0

  selected-navbar:
    material: RED_STAINED_GLASS_PANE
    name: " "
    slot: "%placeholders_get-selected-navbar-slot%"
    hide-tooltip: true
    priority: 1

  job-display:
    material: BOOK
    name: "<title-color>%placeholders_get-job-name%"
    slot: 9
    lore:
      - ""
      - "<lore-color>Level: <accentuation-color>%placeholders_get-level-for-jobs%"
      - "<lore-color>%placeholders_get-exp-for-jobs% %placeholders_get-xp-job-progress% %placeholders_get-maxexp-for-jobs%"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  job-rewards:
    material: CHEST
    name: "<title-color>Rewards"
    slot: 18
    lore:
      - ""
      - "<lore-color>Discover the different rewards"
      - "<lore-color>that you can unlock by leveling up"
      - "<lore-color>in your profession."
      - ""
      - "<action-icon> <action-color>Access"
    click-actions:
      - "[open-menu] jobs-menu %parameters_job_internal-name%"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  job-actions:
    material: EMERALD
    name: "<title-color>Actions"
    slot: 27
    lore:
      - ""
      - "<lore-color>Access your profession actions"
      - "<lore-color>and gain experience."
      - ""
      - "<action-icon> <action-color>Access"
    click-actions:
      - "[open-menu] jobs-actions %parameters_job_internal-name%"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  classement:
    material: MAP
    name: "<title-color>Leaderboard"
    slot: 36
    lore:
      - ""
      - "<lore-color>Discover the best"
      - "<lore-color>players of each job."
      - ""
      - "<action-icon> <action-color>Access"
    click-actions:
      - "[open-menu] jobs-leaderboard %parameters_job_internal-name%"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  ##############################
  #         TAB - JOBS         #
  ##############################

  farmer-job-button:
    material: DIAMOND_HOE
    name: "<title-color>Farmer"
    slot: 3
    lore:
      - ""
      - "<lore-color>Plant seeds, and harvest"
      - "<lore-color>everything the earth gives you."
      - "%placeholders_get-farmer-action-lore%"
    click-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%parameters_job_internal-name%"
          comparison: "!="
          output: "farmer"
    click-actions:
      - "[open-menu] jobs-leaderboard farmer"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  miner-job-button:
    material: DIAMOND_PICKAXE
    name: "<title-color>Miner"
    slot: 4
    lore:
      - ""
      - "<lore-color>Dig to find ore"
      - "<lore-color>and collect useful resources."
      - "%placeholders_get-miner-action-lore%"
    click-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%parameters_job_internal-name%"
          comparison: "!="
          output: "miner"
    click-actions:
      - "[open-menu] jobs-leaderboard miner"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  lumberjack-job-button:
    material: DIAMOND_AXE
    name: "<title-color>Lumberjack"
    slot: 5
    lore:
      - ""
      - "<lore-color>Collect wood, strip trees"
      - "<lore-color>or burn wood to gain experience."
      - "%placeholders_get-lumberjack-action-lore%"
    click-requirement:
      requirements:
        1:
          type: "placeholder"
          input: "%parameters_job_internal-name%"
          comparison: "!="
          output: "lumberjack"
    click-actions:
      - "[open-menu] jobs-leaderboard lumberjack"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  hunter-job-button:
    material: DIAMOND_SWORD
    name: "<title-color>Hunter"
    slot: 6
    lore:
      - ""
      - "<lore-color>Hunt creatures and gather"
      - "<lore-color>their precious loot."
      - "%placeholders_get-hunter-action-lore%"
    click-requirement:
