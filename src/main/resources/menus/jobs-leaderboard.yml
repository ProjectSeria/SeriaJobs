###################################
#             REWARDS             #
###################################

  reward-unlocked:
    name: "<title-color>Level %layout_index_paged%"
    material: "BROWN_DYE"
    lore:
      - "%reward_reward_display%"
      - "<lore-color>Status: <success-color>Unlocked <lore-color>(/jobs claim)"
    taints:
      rewards-item: true
    view-requirement:
      requirements:
        1:
          type: placeholder
          input: "%reward_unlocked%"
          comparison: "=="
          output: "true"
        2:
          type: placeholder
          input: "%layout_index_paged%"
          comparison: "<="
          output: "200"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

  rewards-locked:
    name: "<title-color>Level %layout_index_paged%"
    material: "BROWN_DYE"
    lore:
      - "%reward_reward_display%"
      - "<lore-color>Status: <error-color>Locked"
    taints:
      rewards-item: true
    view-requirement:
      requirements:
        1:
          type: placeholder
          input: "%reward_unlocked%"
          comparison: "=="
          output: "false"
        2:
          type: placeholder
          input: "%layout_index_paged%"
          comparison: "<="
          output: "200"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

##################################
#           NAVIGATION           #
##################################
  close:
    material: RED_DYE
    name: "<error-color>Close"
    slot: 50
    click-actions:
      - "[close]"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"

placeholders:

  get-selected-navbar-slot:
    type: "function"
    function: "short-track"
    input: "%parameters_job_internal-name%"
    tracks:
      "==farmer": 12
      "==miner": 13
      "==lumberjack": 14
      "==hunter": 15
      "==fisherman": 16

###########################
#           MENU          #
###########################
  get-job-name:
    type: "transform"
    transform: "component-wrapper"
    value:
      type: "function"
      function: "short-track"
      input: "%parameters_job_internal-name%"
      tracks:
        "==farmer": "Farmer"
        "==miner": "Miner"
        "==lumberjack": "Lumberjack"
        "==fisherman": "Fisherman"
        "==hunter": "Hunter"
        "!=a": "Unknown"

##################################
#           JOB FARMER           #
##################################

  get-farmer-action-lore:
    type: "transform"
    transform: "list<component-wrapper>"
    value:
      type: "function"
      function: "short-track"
      input: "%parameters_job_internal-name%"
      tracks:
        "==farmer": []
        "!=farmer":
          - ""
          - "<action-icon><action-color> Access"

#################################
#           JOB MINER           #
#################################

