        1:
          type: "placeholder"
          input: "%parameters_job_internal-name%"
          comparison: "!="
          output: "fisherman"
    click-actions:
      - "[open-menu] jobs-leaderboard fisherman"
    item-flags:
      - "HIDE_ATTRIBUTES"
      - "HIDE_ADDITIONAL_TOOLTIP"


