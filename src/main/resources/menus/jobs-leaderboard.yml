#          LEADERBOARD          #
#################################

  'get-material-for-top1-10':
    type: "transform"
    transform: "string"
    value:
      type: "function"
      function: "short-track"
      input: "%parameters_job_internal-name%"
      tracks:
        "==farmer": "NETHERITE_HOE"
        "==miner": "NETHERITE_PICKAXE"
